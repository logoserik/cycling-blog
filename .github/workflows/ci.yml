name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (prod base path)
        run: |
          bash ./scripts/build-blazor-site.sh \
            --source . \
            --out ./ci-out \
            --base /cycling-blog/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-site
          path: ./ci-out
          retention-days: 7
